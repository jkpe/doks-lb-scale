apiVersion: apps/v1
kind: Deployment
metadata:
  name: doks-lb-scale-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doks-lb-scale-controller
  template:
    metadata:
      labels:
        app: doks-lb-scale-controller
    spec:
      serviceAccountName: doks-lb-scale-controller
      containers:
        - name: controller
          image: ghcr.io/jkpe/doks-lb-scale:latest
          imagePullPolicy: Always
          args:
            - "--verbose=$(DOKS_LB_SCALE_VERBOSE)"
            - "--prom-url=$(PROMETHEUS_URL)"
          env:
            - name: DOKS_LB_SCALE_VERBOSE
              value: "true"
            - name: PROMETHEUS_URL
              value: "http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc:9090"
          ports:
            - name: healthz
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            periodSeconds: 10
