{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "doks-lb-scale.clusterRoleName" . }}
  labels:
    {{- include "doks-lb-scale.labels" . | nindent 4 }}
  {{- with .Values.rbac.clusterRoleAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "doks-lb-scale.clusterRoleBindingName" . }}
  labels:
    {{- include "doks-lb-scale.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "doks-lb-scale.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "doks-lb-scale.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
