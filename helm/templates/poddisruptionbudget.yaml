{{- if and .Values.podDisruptionBudget.create (gt (.Values.deployment.replicas | int) 1) -}}
{{- if .Capabilities.APIVersions.Has "policy/v1" }}
apiVersion: policy/v1
{{- else }}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ include "doks-lb-scale.podDisruptionBudgetName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "doks-lb-scale.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "doks-lb-scale.selectorLabels" . | nindent 6 }}
  {{- if .Values.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
{{- end }}
